  - uuid: 24197b344a3a45d09fdfd41f2efea108
    template: INspektor NT PROFIBUS by Zabbix trapper
    name: INspektor NT PROFIBUS by Zabbix trapper
    description: 'Indu-Sol INspektor NT (PROFIBUS) diagnostics pushed by the INspektor-Zabbix collector through Zabbix trapper. One host per INspektor; the host name must match NAME in config.txt.


      Setup and collector: https://github.com/IndusolAmerica/inspektor-zabbix

      Author: Luis Aguirre, InduSol America'
    vendor:
      name: InduSol America
      version: 7.0-2
    groups:
    - name: Templates/Industrial networks
    items:
    - uuid: d2cfd6004b0946a595364a29dd3ce038
      name: Service heartbeat
      type: TRAP
      key: inspektor.heartbeat
      history: 7d
      value_type: UNSIGNED
      description: Sent every cycle by INspektor-Zabbix. Missing data means the collector stopped.
      tags:
      - tag: component
        value: service
      triggers:
      - uuid: cdc6d34986a4421f8a9fdb54dce104b7
        expression: nodata(/INspektor NT PROFIBUS by Zabbix trapper/inspektor.heartbeat,{$INSPEKTOR.NODATA})=1
        name: INspektor-Zabbix service is not sending data
        priority: HIGH
        description: No data from the INspektor-Zabbix collector. Check the scheduled task on the collector PC and access to the Zabbix server or proxy on port 10051.
        tags:
        - tag: scope
          value: availability
    - uuid: 59e9fe6a5d0c4077afd239fef5f2c719
      name: Service version
      type: TRAP
      key: inspektor.service.version
      history: 31d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: service
    - uuid: c2129092baf145df869c39161a7c94c7
      name: INspektor reachable
      type: TRAP
      key: inspektor.status
      history: 31d
      value_type: UNSIGNED
      description: 1 = the INspektor answered over HTTP, 0 = it did not.
      tags:
      - tag: component
        value: inspektor
      triggers:
      - uuid: 8e5c40770249467980ce30b440d8e06b
        expression: max(/INspektor NT PROFIBUS by Zabbix trapper/inspektor.status,#3)=0
        name: INspektor is not reachable
        priority: HIGH
        description: The collector could not read the INspektor for 3 consecutive cycles. The collector itself is running.
        tags:
        - tag: scope
          value: availability
    - uuid: 3e9e1ed66ebe45f0a7e91322af0d44f1
      name: Last read error
      type: TRAP
      key: inspektor.error
      history: 7d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: inspektor
    - uuid: 66fd31d57026485d871580203bee5571
      name: Devices
      type: TRAP
      key: inspektor.devices.total
      history: 31d
      value_type: UNSIGNED
      description: Devices currently reported by the INspektor after filtering.
      tags:
      - tag: component
        value: inspektor
    - uuid: 6010041ae196467a94e2ce4acde38dcf
      name: Bus status
      type: TRAP
      key: inspektor.bus.status
      history: 31d
      value_type: UNSIGNED
      description: Overall bus status of the current INspektor measurement.
      valuemap:
        name: INspektor bus status
      tags:
      - tag: component
        value: inspektor
      triggers:
      - uuid: 02e48fd5c75644b59fde4ac58490d147
        expression: last(/INspektor NT PROFIBUS by Zabbix trapper/inspektor.bus.status)=4
        name: Bus status is Error
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      - uuid: 7007ba2525ae49399ac705e5fb0a3ece
        expression: last(/INspektor NT PROFIBUS by Zabbix trapper/inspektor.bus.status)=3
        name: Bus status is Warning
        priority: WARNING
        tags:
        - tag: scope
          value: performance
    - uuid: b259ee48b91e49a69c1dbc0a4df59c57
      name: Unacknowledged alerts
      type: TRAP
      key: inspektor.alerts.unack
      history: 31d
      value_type: UNSIGNED
      description: Alerts not yet acknowledged on the INspektor web interface.
      tags:
      - tag: component
