zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: aa043904353b41d0bd90cb081b4bc3ff
    name: Templates/Industrial networks
  templates:
  - uuid: 3c33e4f290fa43b3a57ceeb0b4d28be4
    template: INspektor NT PROFINET by Zabbix trapper
    name: INspektor NT PROFINET by Zabbix trapper
    description: 'Indu-Sol INspektor NT (PROFINET) diagnostics pushed by the INspektor-Zabbix collector through Zabbix trapper. One host per INspektor; the host name must match NAME in config.txt.


      Setup and collector: https://github.com/IndusolAmerica/inspektor-zabbix

      Author: Luis Aguirre, InduSol America'
    vendor:
      name: InduSol America
      version: 7.0-2
    groups:
    - name: Templates/Industrial networks
    items:
    - uuid: d8700651741e4977becc2ae6318690a5
      name: Service heartbeat
      type: TRAP
      key: inspektor.heartbeat
      history: 7d
      value_type: UNSIGNED
      description: Sent every cycle by INspektor-Zabbix. Missing data means the collector stopped.
      tags:
      - tag: component
        value: service
      triggers:
      - uuid: 43266487ed0a4dbfbfc8dd570e9e4b97
        expression: nodata(/INspektor NT PROFINET by Zabbix trapper/inspektor.heartbeat,{$INSPEKTOR.NODATA})=1
        name: INspektor-Zabbix service is not sending data
        priority: HIGH
        description: No data from the INspektor-Zabbix collector. Check the scheduled task on the collector PC and access to the Zabbix server or proxy on port 10051.
        tags:
        - tag: scope
          value: availability
    - uuid: 8af0316432954ddc869d0922da738470
      name: Service version
      type: TRAP
      key: inspektor.service.version
      history: 31d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: service
    - uuid: d70eecf745464cbfb95581ceaaeefbdb
      name: INspektor reachable
      type: TRAP
      key: inspektor.status
      history: 31d
      value_type: UNSIGNED
      description: 1 = the INspektor answered over HTTP, 0 = it did not.
      tags:
      - tag: component
        value: inspektor
      triggers:
      - uuid: d5e8a9eba2864cc5ad1e83c9ea99fea9
        expression: max(/INspektor NT PROFINET by Zabbix trapper/inspektor.status,#3)=0
        name: INspektor is not reachable
        priority: HIGH
        description: The collector could not read the INspektor for 3 consecutive cycles. The collector itself is running.
        tags:
        - tag: scope
          value: availability
    - uuid: 5210e9c7e18547999c68df88d9bd7d93
      name: Last read error
      type: TRAP
      key: inspektor.error
      history: 7d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: inspektor
    - uuid: 7e5426712a0c4c7da7ddb983173864a6
      name: Devices
      type: TRAP
      key: inspektor.devices.total
      history: 31d
      value_type: UNSIGNED
      description: Devices currently reported by the INspektor after filtering.
      tags:
      - tag: component
        value: inspektor
    - uuid: 8ccd05fb2e8e494aa574538c597caa08
      name: Bus status
      type: TRAP
      key: inspektor.bus.status
      history: 31d
      value_type: UNSIGNED
      description: Overall bus status of the current INspektor measurement.
      valuemap:
        name: INspektor bus status
      tags:
      - tag: component
        value: inspektor
      triggers:
      - uuid: 85484c6cf53643eeab869ac2eab34326
        expression: last(/INspektor NT PROFINET by Zabbix trapper/inspektor.bus.status)=4
        name: Bus status is Error
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      - uuid: 86134017dbb445f29001956418915b74
        expression: last(/INspektor NT PROFINET by Zabbix trapper/inspektor.bus.status)=3
        name: Bus status is Warning
        priority: WARNING
        tags:
        - tag: scope
          value: performance
    - uuid: 403d4518a95343839d2335cbfb177cd0
      name: Unacknowledged alerts
      type: TRAP
      key: inspektor.alerts.unack
      history: 31d
      value_type: UNSIGNED
      description: Alerts not yet acknowledged on the INspektor web interface.
      tags:
      - tag: component
        value: inspektor
    discovery_rules:
    - uuid: d64420ab338141a78c66fe5fa3231bec
      name: PROFINET devices discovery
      type: TRAP
      key: inspektor.discovery
      lifetime: '{$INSPEKTOR.LLD.LIFETIME}'
      description: Device list pushed by INspektor-Zabbix. Only sent while the INspektor is reachable, so an outage does not mark devices as lost. {#ID} is the MAC address (PROFINET, EtherNet/IP) or the station address (PROFIBUS).
      item_prototypes:
      - uuid: 32e3efb773b545469e36eb2c6e037d05
        name: '{#NAME}: Breakdowns'
        type: TRAP
        key: device.breakdowns[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts.
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: bebc526e850d41958afc8316b580ddf4
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.breakdowns[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.breakdowns[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Breakdowns increased'
          priority: AVERAGE
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: b438a2709a1b44bda9a6c3a62afa6c44
        name: '{#NAME}: Restarts'
        type: TRAP
        key: device.restarts[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts.
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: a593afbc8f7841e5bd49c820b508648f
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.restarts[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.restarts[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Restarts increased'
          priority: WARNING
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: 0ef27f268c3a4ebb979d70d080ae03e6
        name: '{#NAME}: Frame gaps'
        type: TRAP
        key: device.framegaps[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts.
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: c8b68e5afb394837b5f2281e571747a8
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.framegaps[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.framegaps[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Frame gaps increased'
          priority: WARNING
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: 6fdd54dc67824fd1b626ba110de51e5f
        name: '{#NAME}: Max consecutive frame gaps'
        type: TRAP
        key: device.framegaps.max[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Longest run of consecutive frame gaps since measurement start. 3 or more usually means a breakdown is close.
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
      - uuid: 6ea9dfb3b1f54d1486e6d3320061882b
        name: '{#NAME}: Frame overtakes'
        type: TRAP
        key: device.overtakes[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts.
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: 2906aa597cea4287a2093e0472285931
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.overtakes[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.overtakes[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Frame overtakes increased'
          priority: WARNING
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: 53394c051c7748d3854ec39e1551dc16
        name: '{#NAME}: Error frames'
        type: TRAP
        key: device.errorframes[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts. Physical error frames sent + received (cable, connector, EMC).
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: 35b0cab53a4942fcb4aa2ac0494a3c0e
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.errorframes[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.errorframes[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Error frames increased'
          priority: AVERAGE
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: fdf3fb1d0dd94edeb9100c9ced28c16a
        name: '{#NAME}: Alarms high'
        type: TRAP
        key: device.alarms.high[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts. PROFINET-related issue on the device side.
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: be0dca86192849d381db583490a0bbaa
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.alarms.high[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.alarms.high[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Alarms high increased'
          priority: AVERAGE
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: b92a5a5bfe5f4245b6761781e11d683b
        name: '{#NAME}: Alarms low'
        type: TRAP
        key: device.alarms.low[{#ID}]
        history: 31d
        value_type: UNSIGNED
        description: Cumulative since the INspektor measurement started (History column on the device). Resets when a new measurement starts. Issue external to PROFINET (I/O, motor, etc.).
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: 16e82293fd104b1d922a3061bc66cece
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.alarms.low[{#ID}])-min(/INspektor NT PROFINET by Zabbix trapper/device.alarms.low[{#ID}],{$INSPEKTOR.EVENT.WINDOW})>0
          name: '{#NAME}: Alarms low increased'
          priority: INFO
          description: The counter went up within {$INSPEKTOR.EVENT.WINDOW}. Resolves when the window is clean.
          tags:
          - tag: scope
            value: performance
      - uuid: c6f3f1c9a3e64bc3a16345ea0232c836
        name: '{#NAME}: Jitter peak'
        type: TRAP
        key: device.jitter.peak[{#ID}]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: 'max(|min|, |max|), the value the INspektor web page shows. Last minute. Not sent for a minute in which the station had a breakdown, or when the value is +/-100% or beyond: no telegrams arrived, so it is an artefact, not a measurement.'
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: 40bb7e9c22e4401498fd16627451f1b2
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.jitter.peak[{#ID}])>{$INSPEKTOR.JITTER.WARN:"{#ID}"} and nodata(/INspektor NT PROFINET by Zabbix trapper/device.jitter.peak[{#ID}],{$INSPEKTOR.NODATA})=0
          name: '{#NAME}: Jitter peak above {$INSPEKTOR.JITTER.WARN:"{#ID}"}%'
          priority: WARNING
          tags:
          - tag: scope
            value: performance
      - uuid: a973f0aa5bb44b9aa383084e22312bb7
        name: '{#NAME}: Jitter min'
        type: TRAP
        key: device.jitter.min[{#ID}]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: 'Last minute. Not sent for a minute in which the station had a breakdown, or when the value is +/-100% or beyond: no telegrams arrived, so it is an artefact, not a measurement.'
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
      - uuid: 3aa5c89db9864464b3e3f540048c96a9
        name: '{#NAME}: Jitter max'
        type: TRAP
        key: device.jitter.max[{#ID}]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: 'Last minute. Not sent for a minute in which the station had a breakdown, or when the value is +/-100% or beyond: no telegrams arrived, so it is an artefact, not a measurement.'
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
      - uuid: 0f8432876ab24182b649aba74f3d2a78
        name: '{#NAME}: Network load in'
        type: TRAP
        key: device.netload.in[{#ID}]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: Peak of the last minute, as % of a 100 Mbit/s link (12,500,000 bytes/s).
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: 62f6c9974aee474ca515cbddd4f69f4a
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.netload.in[{#ID}])>{$INSPEKTOR.NETLOAD.WARN:"{#ID}"}
          name: '{#NAME}: Network load in above {$INSPEKTOR.NETLOAD.WARN:"{#ID}"}%'
          priority: WARNING
          tags:
          - tag: scope
            value: performance
      - uuid: 46411dd5535f4f8e92ba54964dc6477f
        name: '{#NAME}: Network load out'
        type: TRAP
        key: device.netload.out[{#ID}]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: Peak of the last minute, as % of a 100 Mbit/s link (12,500,000 bytes/s).
        tags:
        - tag: component
          value: device
        - tag: kind
          value: '{#KIND}'
        trigger_prototypes:
        - uuid: 063d4e9287c944c88fe99a57d9fe7aaf
          expression: last(/INspektor NT PROFINET by Zabbix trapper/device.netload.out[{#ID}])>{$INSPEKTOR.NETLOAD.WARN:"{#ID}"}
          name: '{#NAME}: Network load out above {$INSPEKTOR.NETLOAD.WARN:"{#ID}"}%'
          priority: WARNING
          tags:
          - tag: scope
            value: performance
    tags:
    - tag: class
      value: network
    - tag: target
      value: inspektor
    macros:
    - macro: '{$INSPEKTOR.NODATA}'
      value: 5m
      description: Time without data before the collector is considered stopped.
    - macro: '{$INSPEKTOR.EVENT.WINDOW}'
      value: 1h
      description: A counter increase inside this window raises a problem.
    - macro: '{$INSPEKTOR.LLD.LIFETIME}'
      value: 7d
      description: How long a device that left the network keeps its items.
    - macro: '{$INSPEKTOR.JITTER.WARN}'
      value: '50'
      description: 'Jitter peak warning, %. Per device: {$INSPEKTOR.JITTER.WARN:"<MAC>"}.'
    - macro: '{$INSPEKTOR.NETLOAD.WARN}'
      value: '20'
      description: 'Network load warning, % of 100 Mbit/s. Per device: {$INSPEKTOR.NETLOAD.WARN:"<MAC>"}.'
    valuemaps:
    - uuid: 1c28c17754a14d658e7b4240626756e6
      name: INspektor bus status
      mappings:
      - value: '0'
        newvalue: Unknown
      - value: '1'
        newvalue: NoData
      - value: '2'
        newvalue: Active
      - value: '3'
        newvalue: Warning
      - value: '4'
        newvalue: Error
      - value: '5'
        newvalue: Deactivated
